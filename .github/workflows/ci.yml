name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./document-assistant

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: document-assistant/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm test -- --run

      - name: Run Deterministic RAG Evaluation
        run: npm run evaluate

      - name: Build application
        run: npm run build
